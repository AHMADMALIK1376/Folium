name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # `npm test` is the Vitest suite. Until Phase 2C-iii it was the v1
      # `node --test` suite, and Vitest was `npm run test:unit`, which CI never
      # ran — so every frontend test written in 2B and 2C was invisible here.
      # If a second suite is ever added, add a step; do not repoint this one.
      - name: Test
        run: npm test

      # Playwright deliberately stays out of CI: it needs Supabase credentials,
      # which would mean a database password in GitHub secrets and every run
      # creating real accounts. It runs locally, against a real project.

      - name: Build
        run: npm run build
