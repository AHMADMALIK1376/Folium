[project]
name = "folium-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pyjwt[crypto]>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Mints y-sweet room tokens for live collaboration. Chosen over the
    # alternatives specifically because a Python SDK exists: the endpoint that
    # checks whether the caller may open a document and the one that issues its
    # room token are then the same function, in the service that owns every
    # other permission decision.
    #
    # It calls out with `requests`, which is synchronous — every use from
    # FastAPI must go through a thread, or it blocks the event loop.
    "y-sweet-sdk>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
